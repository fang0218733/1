<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知伴 · 管理工作台</title><link rel="stylesheet" href="/admin/style.css"></head><body>
<header><div><small>知伴 · STUDIO</small><h1>角色与订单工作台</h1></div><button id="logout" hidden>退出登录</button></header>
<main><div id="notice" class="notice">不接收真实付款。生成内容需你审核后才能交付或公开。</div><div id="message" role="status"></div>
<section id="login"><h2>管理员登录</h2><p>正式模式使用服务端配置的管理密码。本机演示可直接进入。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button>登录 / 进入本机演示</button></form></section>
<div id="workspace" hidden><nav><button id="cardsTab">角色大厅</button><button id="ordersTab">定制订单</button><button id="refresh">刷新数据</button></nav>
<section id="cardsPanel"><h2>免费角色卡</h2><p>录入你自己的角色内容，上传封面，保存为草稿或发布到大厅。订单生成的公开卡请到订单中审核。</p><button id="newCard">新增角色卡</button><div id="cards" class="grid"></div>
<form id="cardForm" class="editor"><h3>角色编辑</h3><input name="id" type="hidden"><label>名称<input name="name" maxlength="60" required></label><label>作品方向<select name="relationship"><option>BG</option><option>GL</option><option>BL</option></select></label><label>分类<input name="category" maxlength="40" required></label><label>标签<input name="tag" maxlength="100" required></label><label>简介<textarea name="intro" maxlength="300" required></textarea></label><label>封面（PNG/JPEG/WebP，2MB以内）<input id="coverFile" type="file" accept="image/png,image/jpeg,image/webp"></label><input name="cover" type="hidden"><img id="coverPreview" hidden alt="封面预览"><label>完整人设<textarea name="card" maxlength="12000" required rows="10"></textarea></label><label><input name="published" type="checkbox"> 发布到免费大厅（取消勾选即下架）</label><button>保存角色</button></form></section>
<section id="ordersPanel" hidden><h2>定制申请</h2><p>参考价格不等于已付款，目前所有申请均未收费。生成时会把问卷和具体要求发送到 DeepSeek。</p><div id="loyaltySummary"></div><div id="orders"></div><form id="reviewForm" class="editor" hidden><h3>审核并交付</h3><div id="orderDetail"></div><button type="button" id="generate">生成 / 重新生成草稿</button><label>最终人设卡（请逐项审核）<textarea name="card" rows="14" maxlength="12000" required></textarea></label><div id="ultraFields" hidden><label>人物生平<textarea name="biography" rows="8" maxlength="8000"></textarea></label><label>世界观<textarea name="worldView" rows="8" maxlength="8000"></textarea></label><label>世界背景<textarea name="worldBackground" rows="8" maxlength="8000"></textarea></label></div><label><input name="publish" type="checkbox"> 同时发布成品到免费大厅</label><div id="publicFields"><label>公开名称<input name="name" maxlength="60"></label><label>作品方向<select name="relationship"><option>BG</option><option>GL</option><option>BL</option></select></label><label>分类<input name="category" maxlength="40"></label><label>标签<input name="tag" maxlength="100"></label><label>公开简介<textarea name="intro" maxlength="300"></textarea></label></div><label><input id="reviewConfirm" type="checkbox" required> 已人工审核；公开内容不包含客户个人信息</label><button>确认交付（并按选择公开）</button></form></section></div></main><script src="/admin/app.js"></script></body></html>
